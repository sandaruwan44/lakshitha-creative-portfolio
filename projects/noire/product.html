<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fragrance | NOIRÉ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="inner-page">
  <header class="site-header">
    <button class="menu-toggle" aria-label="Open menu" aria-expanded="false">Menu</button>
    <nav class="main-nav"><a href="index.html">Home</a><a href="collection.html">Collections</a><a href="shop.html">Shop</a></nav>
    <a class="brand" href="index.html">NOIRÉ</a>
    <div class="header-actions"><a href="shop.html">All scents</a><a href="cart.html">Bag <span class="cart-count">0</span></a></div>
  </header>
  <main class="detail-page generated-detail">
    <img class="detail-bg" id="productVisual" src="img/collection/cedar-eclipse.png" alt="">
    <section class="detail-copy reveal">
      <p class="eyebrow" id="productEyebrow">NOIRÉ · Eau de Parfum</p>
      <h1 id="productTitle">Cedar<br>Eclipse</h1>
      <p class="detail-price" id="productPrice">¥13,800</p>
      <p id="productDescription">A deep composition created for the NOIRÉ fragrance wardrobe.</p>
      <div class="notes">
        <div><span>Top note</span><strong id="productTop">Bergamot</strong></div>
        <div><span>Heart note</span><strong id="productHeart">Cedar</strong></div>
        <div><span>Base note</span><strong id="productBase">Oud</strong></div>
      </div>
      <button class="detail-add" id="productAdd">Add to bag</button>
    </section>
  </main>
  <div class="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
