<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    html {
      scroll-behavior: smooth;
    }
    * {
      margin: 0;
      padding: 0;
    }
    ul {
      list-style: none;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
    header {
      width: 100%;
      height: 100vh;
      background-color: cadetblue;
    }
    .gnav {
      width: 50%;
      height: 100vh;
      color: #fff;
      background-color: rgb(79, 80, 80);
      position: fixed;
      top: 0;
      left: 50%;
      font-size: 20px;
      transform: translateX(100%);
    }
    .gnav.active {
      transform: translateX(0);
      transition: 0.2s;
    }
    .gnav ul {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .gnav li {
      line-height: 3;
    }
    /* humburger */
    .humburger-btn {
      width: 60px;
      height: 60px;
      border: 1px solid #fff;
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .humburger-btn span {
      width: 70%;
      height: 2px;
      background-color: #fff;
      position: relative;
    }
    .humburger-btn.active span {
      background-color: transparent;
      transition: 0.1s;
    }
    .humburger-btn span::after {
      content: "";
      width: 100%;
      height: 2px;
      background-color: #fff;
      display: block;
      position: absolute;
      top: 12px;
    }
    .humburger-btn.active span::after {
      top: 0;
      rotate: 45deg;
      transition: 0.2s;
    }
    .humburger-btn span::before {
      content: "";
      width: 100%;
      height: 2px;
      background-color: #fff;
      display: block;
      position: absolute;
      bottom: 12px;
    }
    .humburger-btn.active span::before {
      rotate: 135deg;
      transition: 0.2s;
      bottom: 0;
    }
    .btn1 {
      height: 100vh;
      background-color: chartreuse;
    }
    .btn2 {
      height: 100vh;
      background-color: #d91ec9;
    }
    .btn3 {
      height: 100vh;
      background-color: #d9c61e;
    }
  </style>
</head>
<body id="top">
  <header>
    <nav class="gnav">
      <ul>
        <li><a href="#top">ホーム</a></li>
        <li><a href="#btn1">ボタン１</a></li>
        <li><a href="#btn2">ボタン２</a></li>
        <li><a href="#btn3">ボタン３</a></li>
      </ul>
    </nav><!-- /.gnav -->
  </header>
  <div class="humburger-btn" id="hum-btn">
    <span></span>
  </div><!-- /.humburger-btn -->
  <main>
    <section class="btn1" id="btn1"></section>
    <section class="btn2" id="btn2"></section>
    <section class="btn3" id="btn3"></section>
  </main>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script>
    $(function(){
      $('#hum-btn').on('click',function(){
        $(this).toggleClass('active');
        $('.gnav').toggleClass('active');
      });
      $('.gnav a').on('click',function(){
        $('#hum-btn').removeClass('active');
        $('.gnav').removeClass('active');
      });
    });
  </script>
</body>
</html>
